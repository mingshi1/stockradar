name: Windows Release Build

on:
  workflow_dispatch:
  push:
    branches:
      - "main"
      - "dev-v1.0-*"
    tags:
      - "v*"

jobs:
  build-windows:
    runs-on: windows-latest

    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install deterministic dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install -r requirements-build.txt
          python -m pip check

      - name: Build Windows EXE with MSVC environment
        shell: pwsh
        run: |
          .\scripts\build_windows_ci.ps1

      - name: Upload Windows build diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: StockEventRadar-Windows-Diagnostics-1.0.0-rc4.7
          if-no-files-found: ignore
          path: |
            pysidedeploy.spec
            deployment/**
            dist/**

      - name: Install Inno Setup
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress

      - name: Build Installer
        shell: pwsh
        run: |
          .\scripts\build_installer.ps1

      - name: Upload build artifact
        uses: actions/upload-artifact@v6
        with:
          name: StockEventRadar-Windows-1.0.0-rc4.7
          if-no-files-found: error
          path: |
            dist/StockEventRadar.exe
            installer/output/StockEventRadar-Setup-1.0.0-rc4.7.exe

      - name: Publish GitHub Release asset
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${env:GITHUB_REF_NAME}"

          gh release view $tag *> $null

          if ($LASTEXITCODE -ne 0) {
            gh release create $tag --title $tag --generate-notes
          }

          gh release upload $tag `
            "dist/StockEventRadar.exe" `
            "installer/output/StockEventRadar-Setup-1.0.0-rc4.7.exe" `
            --clobber
