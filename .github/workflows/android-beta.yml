name: Android Beta Build

on:
  workflow_dispatch:
  push:
    branches:
      - "dev-v1.0-*"

env:
  QT_FOR_PYTHON_VERSION: "6.11.1"
  QT_FOR_PYTHON_BRANCH: "6.11"
  PYSIDE_ANDROID_WHEEL_URL: "https://download.qt.io/official_releases/QtForPython/pyside6/pyside6-6.11.1-6.11.1-cp311-cp311-android_aarch64.whl"
  SHIBOKEN_ANDROID_WHEEL_URL: "https://download.qt.io/official_releases/QtForPython/shiboken6/shiboken6-6.11.1-6.11.1-cp311-cp311-android_aarch64.whl"

jobs:
  android-beta:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install app build environment
        shell: bash
        run: |
          set -euxo pipefail
          python -m pip install --upgrade pip
          python -m pip install -r requirements-android.txt
          python -m pip check
          python -c "import PySide6, PySide6.QtCore; print('PySide6', PySide6.__version__); print('Qt', PySide6.QtCore.__version__)"

      - name: Verify official Android wheel URLs
        shell: bash
        run: |
          set -euxo pipefail

          curl --fail --location --retry 3 --head \
            "$PYSIDE_ANDROID_WHEEL_URL"

          curl --fail --location --retry 3 --head \
            "$SHIBOKEN_ANDROID_WHEEL_URL"

      - name: Download official Android ARM64 wheels
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p android-wheels

          curl --fail --location --retry 3 \
            "$PYSIDE_ANDROID_WHEEL_URL" \
            -o "android-wheels/pyside6-${QT_FOR_PYTHON_VERSION}-android_aarch64.whl"

          curl --fail --location --retry 3 \
            "$SHIBOKEN_ANDROID_WHEEL_URL" \
            -o "android-wheels/shiboken6-${QT_FOR_PYTHON_VERSION}-android_aarch64.whl"

          ls -lh android-wheels

          test -s "android-wheels/pyside6-${QT_FOR_PYTHON_VERSION}-android_aarch64.whl"
          test -s "android-wheels/shiboken6-${QT_FOR_PYTHON_VERSION}-android_aarch64.whl"

      - name: Clone matching Qt for Python tools
        shell: bash
        run: |
          set -euxo pipefail

          git clone --depth 1 --branch "$QT_FOR_PYTHON_BRANCH" \
            https://code.qt.io/pyside/pyside-setup

          test -f pyside-setup/tools/cross_compile_android/requirements.txt
          test -f pyside-setup/tools/cross_compile_android/main.py

      - name: Install Qt Android tool dependencies
        shell: bash
        run: |
          set -euxo pipefail

          python -m pip install \
            -r pyside-setup/tools/cross_compile_android/requirements.txt

          python -m pip check

          # The Qt helper imports `git` from the GitPython package.
          python -c "import git; print('GitPython OK:', git.__version__)"

      - name: Download matching Android SDK and NDK
        shell: bash
        run: |
          set -euxo pipefail

          python pyside-setup/tools/cross_compile_android/main.py \
            --download-only \
            --skip-update \
            --auto-accept-license

          echo "Qt Android deploy cache:"
          find "$HOME/.pyside6-android-deploy" -maxdepth 3 -type d -print || true

      - name: Build Android APK Beta
        shell: bash
        run: |
          set -euxo pipefail
          chmod +x scripts/build_android.sh

          ./scripts/build_android.sh \
            "$PWD/android-wheels/pyside6-${QT_FOR_PYTHON_VERSION}-android_aarch64.whl" \
            "$PWD/android-wheels/shiboken6-${QT_FOR_PYTHON_VERSION}-android_aarch64.whl"

      - name: Collect APK/AAB
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p android-output

          find . -maxdepth 7 \( -name "*.apk" -o -name "*.aab" \) \
            -not -path "./android-output/*" \
            -exec cp -v {} android-output/ \;

          ls -lah android-output

          if ! find android-output -type f \( -name "*.apk" -o -name "*.aab" \) | grep -q .; then
            echo "No APK/AAB was produced."
            exit 1
          fi

      - name: Upload Android Beta
        uses: actions/upload-artifact@v6
        with:
          name: StockEventRadar-Android-Beta-1.0.0-rc4.2
          if-no-files-found: error
          path: android-output/*

      - name: Upload Android diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: StockEventRadar-Android-Diagnostics-1.0.0-rc4.2
          if-no-files-found: ignore
          path: |
            pysidedeploy.spec
            .buildozer/**
            deployment/**
            pyside-setup/tools/cross_compile_android/**
