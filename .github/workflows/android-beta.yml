name: Android Beta Build

on:
  workflow_dispatch:
  push:
    branches:
      - "dev-v1.0-*"

env:
  QT_FOR_PYTHON_VERSION: "6.11.1"
  QT_FOR_PYTHON_BRANCH: "6.11"
  PYSIDE_ANDROID_WHEEL_URL: "https://download.qt.io/official_releases/QtForPython/pyside6/pyside6-6.11.1-6.11.1-cp311-cp311-android_aarch64.whl"
  SHIBOKEN_ANDROID_WHEEL_URL: "https://download.qt.io/official_releases/QtForPython/shiboken6/shiboken6-6.11.1-6.11.1-cp311-cp311-android_aarch64.whl"

jobs:
  android-beta:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Verify Java
        shell: bash
        run: |
          set -euxo pipefail
          java -version
          javac -version
          echo "JAVA_HOME=$JAVA_HOME"

      - name: Install app build environment
        shell: bash
        run: |
          set -euxo pipefail

          python -m pip install --upgrade pip
          python -m pip install -r requirements-android.txt
          python -m pip check

          python - <<'PY'
          import sys
          import PySide6
          import PySide6.QtCore

          print("Python:", sys.version)
          print("PySide6:", PySide6.__version__)
          print("Qt:", PySide6.QtCore.__version__)
          print("PySide6 path:", PySide6.__file__)
          PY

      - name: Install pyside6-android-deploy runtime dependencies
        shell: bash
        run: |
          set -euxo pipefail

          ANDROID_REQ="$(python - <<'PY'
          from pathlib import Path
          import PySide6

          path = (
              Path(PySide6.__file__).resolve().parent
              / "scripts"
              / "requirements-android.txt"
          )
          print(path)
          PY
          )"

          echo "PySide6 Android deploy requirements:"
          echo "$ANDROID_REQ"

          test -f "$ANDROID_REQ"
          python -m pip install -r "$ANDROID_REQ"
          python -m pip check

          python - <<'PY'
          import pkginfo
          print("pkginfo installed")
          PY

      - name: Verify official Android wheel URLs
        shell: bash
        run: |
          set -euxo pipefail

          curl --fail --location --retry 3 --head \
            "$PYSIDE_ANDROID_WHEEL_URL"

          curl --fail --location --retry 3 --head \
            "$SHIBOKEN_ANDROID_WHEEL_URL"

      - name: Download official Android ARM64 wheels
        shell: bash
        run: |
          set -euxo pipefail

          mkdir -p android-wheels

          curl --fail --location --retry 3 \
            "$PYSIDE_ANDROID_WHEEL_URL" \
            -o "android-wheels/pyside6-${QT_FOR_PYTHON_VERSION}-android_aarch64.whl"

          curl --fail --location --retry 3 \
            "$SHIBOKEN_ANDROID_WHEEL_URL" \
            -o "android-wheels/shiboken6-${QT_FOR_PYTHON_VERSION}-android_aarch64.whl"

          ls -lh android-wheels

          test -s "android-wheels/pyside6-${QT_FOR_PYTHON_VERSION}-android_aarch64.whl"
          test -s "android-wheels/shiboken6-${QT_FOR_PYTHON_VERSION}-android_aarch64.whl"

      - name: Clone matching Qt for Python tools outside app project
        shell: bash
        run: |
          set -euxo pipefail

          QT_TOOLS_DIR="$RUNNER_TEMP/pyside-setup"
          rm -rf "$QT_TOOLS_DIR"

          git clone \
            --depth 1 \
            --branch "$QT_FOR_PYTHON_BRANCH" \
            https://code.qt.io/pyside/pyside-setup \
            "$QT_TOOLS_DIR"

          test -f "$QT_TOOLS_DIR/requirements.txt"
          test -f "$QT_TOOLS_DIR/tools/cross_compile_android/requirements.txt"
          test -f "$QT_TOOLS_DIR/tools/cross_compile_android/main.py"

          echo "Qt tools are outside the application project:"
          echo "  $QT_TOOLS_DIR"
          echo "Application project:"
          echo "  $GITHUB_WORKSPACE"

          case "$QT_TOOLS_DIR" in
            "$GITHUB_WORKSPACE"/*)
              echo "ERROR: Qt tools were cloned inside the app project."
              exit 1
              ;;
          esac

      - name: Install Qt for Python tool dependencies
        shell: bash
        run: |
          set -euxo pipefail

          QT_TOOLS_DIR="$RUNNER_TEMP/pyside-setup"

          python -m pip install \
            -r "$QT_TOOLS_DIR/requirements.txt"

          python -m pip install \
            -r "$QT_TOOLS_DIR/tools/cross_compile_android/requirements.txt"

          python -m pip check

          python - <<'PY'
          import git
          import packaging
          import packaging.version
          import pkginfo

          print("GitPython:", git.__version__)
          print("packaging:", packaging.__version__)
          print("pkginfo installed")
          print(
              "Version parser:",
              packaging.version.Version("6.11.1"),
          )
          PY

      - name: Download matching Android SDK and NDK
        shell: bash
        run: |
          set -euxo pipefail

          QT_TOOLS_DIR="$RUNNER_TEMP/pyside-setup"

          python "$QT_TOOLS_DIR/tools/cross_compile_android/main.py" \
            --download-only \
            --skip-update \
            --auto-accept-license

          echo "Qt Android deploy cache:"
          find "$HOME/.pyside6-android-deploy" \
            -maxdepth 4 \
            -type d \
            -print || true

      - name: Verify app project is clean before deploy
        shell: bash
        run: |
          set -euxo pipefail

          if [ -d "$GITHUB_WORKSPACE/pyside-setup" ]; then
            echo "ERROR: pyside-setup must not exist inside application project."
            exit 1
          fi

          echo "Top-level application project:"
          find "$GITHUB_WORKSPACE" \
            -maxdepth 1 \
            -mindepth 1 \
            -printf "%f\n" \
            | sort

      - name: Build Android APK Beta
        shell: bash
        run: |
          set -euxo pipefail

          chmod +x scripts/build_android.sh

          ./scripts/build_android.sh \
            "$PWD/android-wheels/pyside6-${QT_FOR_PYTHON_VERSION}-android_aarch64.whl" \
            "$PWD/android-wheels/shiboken6-${QT_FOR_PYTHON_VERSION}-android_aarch64.whl"

      - name: Validate collected APK/AAB
        shell: bash
        run: |
          set -euxo pipefail

          echo "Android output produced by build_android.sh:"
          ls -lah android-output

          find android-output \
            -maxdepth 1 \
            -type f \
            \( -iname "*.apk" -o -iname "*.aab" \) \
            -print

          if ! find android-output \
            -maxdepth 1 \
            -type f \
            \( -iname "*.apk" -o -iname "*.aab" \) \
            | grep -q .; then
            echo "No normalized APK/AAB was found in android-output."
            exit 1
          fi

      - name: Upload Android Beta
        uses: actions/upload-artifact@v6
        with:
          name: StockEventRadar-Android-Beta-1.0.0-rc4.6
          if-no-files-found: error
          path: android-output/*

      - name: Upload Android diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: StockEventRadar-Android-Diagnostics-1.0.0-rc4.6
          if-no-files-found: ignore
          include-hidden-files: true
          path: |
            pysidedeploy.spec
            .buildozer/**
            deployment/**
            android-output/**
            .android-artifacts-found.txt
            .android-build-start
            pysidedeploy.spec
